<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MediOps Pilot</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--text:#17202a;--muted:#68727d;--line:#e5e9ed;--brand:#175cd3;--good:#138a5b;--warn:#c77800;--danger:#c03434;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 14px 92px}.top,.row,.section{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:25px;font-weight:900;margin:4px 0}.sub,.small{font-size:12px;color:var(--muted);line-height:1.5}.eyebrow{font-size:12px;font-weight:900;color:var(--brand)}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.hero{background:#10213b;color:#fff}.hero .small{color:#dbe8ff}.heroValue{font-size:34px;font-weight:900;margin:6px 0}.grid2,.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid4{grid-template-columns:repeat(4,1fr)}.value{font-size:22px;font-weight:900;margin-top:4px}.row{padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.rowTitle{font-size:14px;font-weight:800}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850;border:1px solid var(--line)}.danger{color:var(--danger);background:#fff0f0}.warn{color:var(--warn);background:#fff7e7}.good{color:var(--good);background:#eaf8f2}.info{color:var(--brand);background:#eaf2ff}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:850;background:var(--brand);color:#fff;cursor:pointer}.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.sm{padding:8px 10px;font-size:12px}.block{width:100%}.input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(calc(100% - 22px),736px);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:21px;padding:7px}.nav button{border:0;background:transparent;padding:8px 2px;border-radius:14px;color:var(--muted);font-size:11px}.nav span{display:block;font-size:19px}.nav .active{background:#eaf2ff;color:var(--brand);font-weight:900}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginBox{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:25px}.mark{width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:28px}.roleGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.clock{text-align:center}.clockTime{font-size:40px;font-weight:900}.clockBtn{width:100%;border:0;border-radius:17px;padding:16px;background:var(--brand);color:#fff;font-size:16px;font-weight:900}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;padding:11px 15px;border-radius:13px;z-index:40;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:520px){.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
const state={role:null,view:'home',inventory:[{name:'니트릴 장갑 M',qty:4,unit:'박스',min:5,status:'부족'},{name:'필러 A',qty:12,unit:'개',min:6,status:'D-12'},{name:'알코올솜',qty:18,unit:'팩',min:10,status:'정상'},{name:'보톡스 B',qty:7,unit:'병',min:5,status:'D-28'},{name:'마스크 KF94',qty:3,unit:'박스',min:4,status:'부족'}]};
const app=document.getElementById('app');
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
function pill(t,c=''){return `<span class="pill ${c}">${t}</span>`}function header(t,s){return `<header class="top"><div><div class="eyebrow">${state.role==='admin'?'병원 운영관리':'직원 모드'}</div><div class="title">${t}</div><div class="sub">${s||''}</div></div><button class="btn secondary sm" onclick="state.role=null;render()">전환</button></header>`}
function nav(){const a=[['🏠','홈','home'],['📦','재고','inventory'],['🕒','근태','attendance'],['🌴','연차','leave'],['👥',state.role==='admin'?'직원':'팀',state.role==='admin'?'employees':'team']];return `<nav class="nav">${a.map(x=>`<button class="${state.view===x[2]?'active':''}" onclick="go('${x[2]}')"><span>${x[0]}</span>${x[1]}</button>`).join('')}</nav>`}
function login(){app.innerHTML=`<main class="login"><section class="loginBox"><div class="mark">✚</div><div class="eyebrow">MediOps Pilot</div><div class="title">병원 운영을 한 화면에서</div><p class="sub">근태 · 연차 · 재고 · 패키지를 연결하는 파일럿입니다.</p><input class="input" placeholder="010-1234-5678"><button class="btn block" style="margin-top:10px" onclick="toast('파일럿: SMS 연결 전입니다')">인증번호 받기</button><div class="roleGrid"><button class="btn secondary" onclick="enter('admin')">관리자 데모</button><button class="btn secondary" onclick="enter('employee')">직원 데모</button></div></section></main>`}
function enter(r){state.role=r;state.view='home';render()}function go(v){state.view=v;render()}
function adminHome(){return `${header('오늘 병원 현황','파일럿 대시보드')}<section class="card hero"><div class="small">오늘 처리할 일</div><div class="heroValue">8건</div><div class="grid4"><div>연차 2</div><div>근태 1</div><div>부족 3</div><div>패키지 2</div></div></section><div class="grid2"><div class="stat"><div class="small">근무중</div><div class="value">18</div></div><div class="stat"><div class="small">부족재고</div><div class="value">3</div></div></div><section class="card"><div class="section"><b>패키지 위험</b>${pill('D-7','danger')}</div><div class="row"><div><b>A메디칼 Premium 700</b><div class="small">잔액 2,450,000원 · 서비스 필러 A 7개</div></div>${pill('재계약 검토','warn')}</div></section>${nav()}`}
function employeeHome(){return `${header('김지은님, 좋은 하루예요','오늘 09:00–18:00')}<section class="card clock"><div class="small">오늘 예정 근무</div><div class="clockTime">09:00</div><p class="sub">휴게 13:00–14:00</p><button class="clockBtn" onclick="toast('QR + GPS 출근 데모')">📷 QR + GPS로 출근하기</button></section><div class="grid2"><div class="stat"><div class="small">남은 연차</div><div class="value">11.5일</div></div><div class="stat"><div class="small">재고 사용</div><div class="value">5품목</div></div></div><section class="card"><div class="section"><b>📦 자주 쓰는 재고</b><button class="btn secondary sm" onclick="go('inventory')">전체 재고</button></div>${state.inventory.slice(0,2).map((i,n)=>`<div class="row"><div><b>${i.name}</b><div class="small">현재 ${i.qty}${i.unit}</div></div><button class="btn secondary sm" onclick="useItem(${n})">-1 사용</button></div>`).join('')}</section>${nav()}`}
function inventory(){return `${header(state.role==='admin'?'재고 관리':'재고 사용',state.role==='admin'?'입출고 · 부족 · 유통기한':'조회 · 원터치 사용등록')}<section class="card">${state.inventory.map((i,n)=>`<div class="row"><div><div class="rowTitle">${i.name}</div><div class="small">현재 ${i.qty}${i.unit} · 최소 ${i.min}${i.unit}</div></div><div class="actions">${pill(i.status,i.status==='부족'?'danger':i.status==='정상'?'good':'warn')}<button class="btn secondary sm" onclick="useItem(${n})">-1</button></div></div>`).join('')}</section>${state.role==='employee'?'<p class="sub">직원은 조회와 사용등록만 가능합니다. 입고·발주·수량조정·패키지는 관리자 권한입니다.</p>':''}${nav()}`}
function useItem(n){if(state.inventory[n].qty>0)state.inventory[n].qty--;toast(`${state.inventory[n].name} 1${state.inventory[n].unit} 사용등록`);render()}
function attendance(){return `${header(state.role==='admin'?'근태 현황':'내 근태','지각 · 조퇴 · 근무시간 자동계산')}<div class="grid4"><div class="stat"><div class="small">총근무</div><div class="value">128h</div></div><div class="stat"><div class="small">지각</div><div class="value">1</div></div><div class="stat"><div class="small">조퇴</div><div class="value">0</div></div><div class="stat"><div class="small">연장</div><div class="value">1.3h</div></div></div><section class="card"><div class="row"><span>8/10 · 09:04 → 18:12</span>${pill('정상','good')}</div><div class="row"><span>8/9 · 09:09 → 18:05</span>${pill('지각 4분','danger')}</div></section>${nav()}`}
function leave(){return `${header('연월차',state.role==='admin'?'신청 · 승인 · 반려':'연차 · 오전반차 · 오후반차')}<section class="card hero"><div class="small">${state.role==='admin'?'승인 대기':'현재 잔여'}</div><div class="heroValue">${state.role==='admin'?'2건':'11.5일'}</div></section><section class="card"><div class="row"><div><b>8월 18일 · 오전반차</b><div class="small">승인 후 11.0일</div></div><button class="btn sm" onclick="toast('${state.role==='admin'?'승인 처리':'신청 접수'}')">${state.role==='admin'?'승인':'신청하기'}</button></div></section>${nav()}`}
function employees(){return `${header('직원 관리','부서 · 직급 · 근무표 · 권한')}<section class="card">${['김지은 · 간호팀','박서준 · 데스크','이유나 · 간호팀','최민호 · 진료팀','정다은 · 상담팀'].map(x=>`<div class="row"><b>${x}</b>${pill('재직','good')}</div>`).join('')}</section>${nav()}`}
function team(){return `${header('오늘 팀 현황','개인 근태 상세는 비공개')}<section class="card">${[['김지은','근무중'],['이유나','연차'],['서하늘','근무중'],['윤채원','휴무']].map(x=>`<div class="row"><b>${x[0]}</b>${pill(x[1],x[1]==='근무중'?'good':x[1]==='연차'?'info':'')}</div>`).join('')}</section>${nav()}`}
function render(){if(!state.role)return login();const f=state.role==='admin'?{home:adminHome,inventory,attendance,leave,employees}:{home:employeeHome,inventory,attendance,leave,team};app.innerHTML=`<main class="app">${(f[state.view]||f.home)()}</main>`}render();
</script></body></html>
